name: CI

on:
  push:
  pull_request:

jobs:
  python-core:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned CPU runtime
        run: python -m pip install --disable-pip-version-check --requirement requirements-cpu.lock.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Check public release tree
        run: python scripts/public_tree_check.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
