name: Release source archive

on:
  push:
    tags:
      - "v0.1.0"

permissions:
  contents: write

jobs:
  source-release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned CPU runtime
        run: python -m pip install --disable-pip-version-check --requirement requirements-cpu.lock.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Verify release tree
        run: |
          python -m compileall -q .
          python scripts/public_tree_check.py
          python -m unittest discover -s tests -v
      - name: Build source archive and checksum
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $archive = "LocalReaderApp-$tag-source.zip"
          git archive --format=zip --output=$archive $tag
          python scripts/archive_check.py $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ascii "$archive.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "LocalReaderApp-${{ github.ref_name }}-source.zip" "LocalReaderApp-${{ github.ref_name }}-source.zip.sha256" --title "LocalReaderApp ${{ github.ref_name }}" --notes-file RELEASE_NOTES_v0.1.0.md
